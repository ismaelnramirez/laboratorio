  const cat = CATEGORIAS.find(c => c.id === p.categoria_id);
  const catKey = (cat ? cat.nombre : '').trim().toUpperCase();
  const grupo = SUGERENCIAS_TEXTO[catKey];
  if (!grupo) return null;
  return grupo[(p.nombre || '').trim().toUpperCase()] || null;
}

async function init() {
  const codigoVerificar = new URLSearchParams(window.location.search).get('verificar');
  if (codigoVerificar) {
    await mostrarVerificacionPublica(codigoVerificar);
    return;
  }
  const { data } = await supabase.auth.getSession();
  if (data.session) {
    await onAuthed(data.session.user);
  } else {
    render();
  }
  supabase.auth.onAuthStateChange((event) => {
    if (event === 'SIGNED_OUT') { sesion = null; pacientes = []; ordenes = []; medicos = []; bitacora = []; render(); }
  });
}

async function onAuthed(user) {
  const { data: perfil, error } = await supabase.from('perfiles').select('*').eq('id', user.id).single();
  if (error || !perfil) { loginError = 'No se encontró tu perfil. Contacta al administrador.'; await supabase.auth.signOut(); render(); return; }
  if (perfil.activo === false) { loginError = 'Tu cuenta está desactivada. Contacta al administrador.'; await supabase.auth.signOut(); render(); return; }
  sesion = { id: perfil.id, nombre: perfil.nombre, correo: perfil.correo, rol: perfil.rol, permisos_extra: perfil.permisos_extra || [] };
  loginError = '';
  await fetchTodo();
  view = vistaInicial();
  render();
}

async function fetchTodo() {
  const [cat, pru, lab, pac, med, ord, ins] = await Promise.all([
    supabase.from('categorias').select('*').order('orden'),
    supabase.from('pruebas').select('*, valores_referencia(*)').order('id'),
    supabase.from('laboratorio_config').select('*').eq('id', 1).single(),
    supabase.from('pacientes').select('*').order('id'),
    supabase.from('medicos').select('*').order('id'),
    supabase.from('ordenes').select('*, orden_detalle(*)').order('id'),
    supabase.from('insumos').select('*').order('nombre')
  ]);
  insumos = ins.data || [];
  CATEGORIAS = cat.data || [];
  PRUEBAS = (pru.data || []).map(p => ({
    id: p.id, categoria_id: p.categoria_id, nombre: p.nombre, unidad: p.unidad, tipo: p.tipo, activo: p.activo,
    opciones: p.opciones || null, subgrupo: p.subgrupo || null, sugerencias: p.sugerencias || null,
    ref: (p.valores_referencia || []).map(r => ({
      sexo: r.sexo, min: r.valor_min ?? undefined, max: r.valor_max ?? undefined,
      texto: r.texto_referencia ?? undefined, amin: r.edad_min ?? undefined, amax: r.edad_max ?? undefined
    }))
  }));
  laboratorio = lab.data || {};
  pacientes = (pac.data || []).map(p => ({
    id: p.id, nombres: p.nombres, apellidos: p.apellidos, fnac: p.fecha_nacimiento,
    sexo: p.sexo, direccion: p.direccion, telefono: p.telefono, dpi: p.dpi
  }));
  medicos = med.data || [];
  ordenes = (ord.data || []).map(o => ({
    id: o.id, paciente_id: o.paciente_id, fecha: o.fecha, medico: o.medico_nombre,
    estado: o.estado, fecha_validacion: o.fecha_validacion,
    medio_entrega: o.medio_entrega, medio_texto: o.medio_texto, receptor: o.receptor,
    entregado_por: o.entregado_por, fecha_entrega: o.fecha_entrega,
    motivo_anulacion: o.motivo_anulacion, anulada_por: o.anulada_por, fecha_anulacion: o.fecha_anulacion,
    codigo_verificacion: o.codigo_verificacion,
    detalle: (o.orden_detalle || []).map(d => ({ ...d }))
  }));
  bitacora = [];
  usuarios = [];
  historialPedidos = [];
  if (sesion.rol === 'administrador') {
    const { data: bit } = await supabase.from('bitacora').select('*').order('fecha', { ascending: false }).limit(500);
    bitacora = (bit || []).slice().reverse();
    const { data: perf } = await supabase.from('perfiles').select('*').order('creado_en');
    usuarios = perf || [];
  }
  if (sesion.rol === 'tecnico' || sesion.rol === 'administrador') {
    const { data: peds } = await supabase.from('pedidos_insumos').select('*').order('fecha', { ascending: false }).limit(200);
    historialPedidos = peds || [];
  }
}

function parseOpcionesValor(valor, opciones) {
  const seleccionadas = {};
  let otro = '';
  if (valor) {
    const lineas = valor.split('\n').map(s => s.trim()).filter(Boolean);
    const otroLineas = [];
    lineas.forEach(linea => {
      const idx = linea.indexOf(' — ');
      const nombre = idx >= 0 ? linea.slice(0, idx).trim() : linea;
      const nota = idx >= 0 ? linea.slice(idx + 3).trim() : '';
      if (opciones.includes(nombre)) seleccionadas[nombre] = nota;
      else otroLineas.push(linea);
    });
    otro = otroLineas.join(', ');
  }
  return { seleccionadas, otro };
}
function syncOpciones(pruebaId) {
  const lineas = [];
  document.querySelectorAll(`.opcion-item[data-prueba="${pruebaId}"]`).forEach(item => {
    const chk = item.querySelector('.opcion-hallazgo');
    if (!chk || !chk.checked) return;
    const nota = item.querySelector('.opcion-nota');
    const notaVal = nota ? nota.value.trim() : '';
    lineas.push(notaVal ? `${chk.value} — ${notaVal}` : chk.value);
  });
  const otroInput = document.querySelector(`.opcion-otro[data-prueba="${pruebaId}"]`);
  const otro = otroInput ? otroInput.value.trim() : '';
  if (otro) lineas.push(otro);
  const oculto = document.querySelector(`.cap-input[data-id="${pruebaId}"]`);
  if (oculto) oculto.value = lineas.join('\n');
}

function edad(fnac) {
  if (!fnac) return null;
  const d = new Date(fnac), n = new Date();
  let a = n.getFullYear() - d.getFullYear();
  if (n.getMonth() < d.getMonth() || (n.getMonth()===d.getMonth() && n.getDate()<d.getDate())) a--;
  return a;
}

function edadDetalle(fnac) {
  const d = new Date(fnac), n = new Date();
  let years = n.getFullYear() - d.getFullYear();
  let months = n.getMonth() - d.getMonth();
  let days = n.getDate() - d.getDate();
  if (days < 0) { months--; days += new Date(n.getFullYear(), n.getMonth(), 0).getDate(); }
  if (months < 0) { years--; months += 12; }
  return { years, months, days };
}

function edadTexto(fnac) {
  const a = edad(fnac);
  if (a === null) return '—';
  if (a <= 12) {
    const e = edadDetalle(fnac);
    return e.years + ' años, ' + e.months + ' meses, ' + e.days + ' días';
  }
  return a + ' años';
}

function refFor(prueba, paciente) {
  const sexo = paciente ? paciente.sexo : 'A';
  const pacEdad = paciente ? edad(paciente.fnac) : null;
  const bySexo = prueba.ref.filter(r => r.sexo === sexo);
  let match = bySexo.find(r => r.amin !== undefined && pacEdad !== null && pacEdad >= r.amin && pacEdad <= r.amax);
  if (!match) match = bySexo.find(r => r.amin === undefined);
  if (!match) match = prueba.ref.find(r => r.sexo === 'A' && r.amin === undefined);
  return match || null;
}
function refTexto(r) {
  if (!r) return '—';
  if (r.texto) return r.texto;
  if (r.min !== undefined && r.max !== undefined) return r.min + ' - ' + r.max;
  if (r.max !== undefined) return '< ' + r.max;
  if (r.min !== undefined) return '> ' + r.min;
  return '—';
}

window.labsysLogout = async function() { await supabase.auth.signOut(); sesion = null; render(); };
function actualizarMargenMembretado() {
  const espacioCm = laboratorio.espacio_membretado != null ? laboratorio.espacio_membretado : 3;
  if (modoMembretado && membretadoAlcance === 'todas') {
    document.documentElement.style.setProperty('--membrete-top', `calc(${espacioCm}cm + 10mm)`);
  } else {
    document.documentElement.style.removeProperty('--membrete-top');
  }
}
window.labsysToggleMembretado = function() { modoMembretado = !modoMembretado; actualizarMargenMembretado(); render(); };
window.labsysSetMembretadoAlcance = function(v) { membretadoAlcance = v; actualizarMargenMembretado(); render(); };
window.labsysToggleFirmaElectronica = function() { usarFirmaElectronica = !usarFirmaElectronica; render(); };

function renderView() {
  if (!puedeVer(view)) return '<div class="card"><div class="empty">No tienes permiso para ver esta sección.</div></div>';
  if (view === 'pacientes') return viewPacientes();
  if (view === 'ficha-paciente') return viewFichaPaciente();
  if (view === 'medicos') return viewMedicos();
  if (view === 'nueva-orden') return viewNuevaOrden();
  if (view === 'ordenes') return viewOrdenes();
  if (view === 'captura') return viewCaptura();
  if (view === 'captura-pdf') return viewCapturaPDF();
  if (view === 'validacion') return viewValidacion();
  if (view === 'informe') return viewInforme();
  if (view === 'reportes') return viewReportes();
  if (view === 'catalogo') return viewCatalogo();
  if (view === 'laboratorio') return viewLaboratorio();
  if (view === 'usuarios') return viewUsuarios();
  if (view === 'bitacora') return viewBitacora();
  if (view === 'pedidos') return viewPedidos();
  if (view === 'historial-pedidos') return viewHistorialPedidos();
  if (view === 'catalogo-insumos') return viewCatalogoInsumos();
  if (view === 'mi-cuenta') return viewMiCuenta();
  return '';
}

function viewBitacora() {
  const entradas = bitacora.slice().reverse().slice(0, 500);
  const grupos = [];
  entradas.forEach(e => {
    const dia = new Date(e.fecha).toLocaleDateString('es-GT', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    let g = grupos.find(x => x.dia === dia);
    if (!g) { g = { dia, items: [] }; grupos.push(g); }
    g.items.push(e);
  });
  return `
    <h1>Bitácora de cambios</h1>
    <p class="lead">Registro de acciones importantes realizadas en el sistema (últimas ${entradas.length}), agrupadas por día.</p>
    ${grupos.length === 0 ? '<div class="card"><div class="empty">Todavía no hay actividad registrada.</div></div>' : grupos.map((g, i) => `
      <details class="catgroup" ${i === 0 ? 'open' : ''}>
        <summary>
          <span class="catname" style="text-transform:capitalize;" onclick="event.preventDefault(); this.closest('details').open = !this.closest('details').open;">${g.dia}</span>
          <span class="catcount">${g.items.length} acciones</span>
        </summary>
        <table style="margin:0 14px 10px;width:calc(100% - 28px);"><thead><tr><th>Hora</th><th>Usuario</th><th>Rol</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>
          ${g.items.map(e => `
            <tr>
              <td class="refbox">${new Date(e.fecha).toLocaleTimeString()}</td>
              <td>${e.usuario}</td>
              <td style="text-transform:capitalize;" class="refbox">${e.rol}</td>
              <td>${e.accion}</td>
              <td class="refbox">${e.detalle || ''}</td>
            </tr>`).join('')}
        </tbody></table>
      </details>`).join('')}
  `;
}

function groupByCat(detalle) {
  return CATEGORIAS.map(c => ({
    cat: c, items: detalle.filter(d => pruebaById(d.prueba_id).categoria_id === c.id)
                           .sort((a, b) => a.prueba_id - b.prueba_id)
  })).filter(g => g.items.length);
}

// Subdivide una lista ya ordenada de resultados en bloques consecutivos por subgrupo
// (ej. "Examen Físico" / "Examen Bioquímico" / "Examen Microscópico" / "Otros" dentro de Urología).
// Si ninguna prueba tiene subgrupo, regresa un solo bloque sin título.
function agruparPorSubgrupo(items) {
  const out = [];
  let last;
  let huboAlguno = false;
  items.forEach(d => {
    const p = pruebaById(d.prueba_id);
    const sg = p.subgrupo || null;
    if (sg) huboAlguno = true;
    if (out.length === 0 || sg !== last) { out.push({ subgrupo: sg, items: [] }); last = sg; }
    out[out.length - 1].items.push(d);
  });
  return huboAlguno ? out : [{ subgrupo: null, items }];
}

                inputHtml = `
                  <input type="text" class="cap-input" data-id="${d.prueba_id}" value="${d.valor_texto ?? ''}" style="display:none;">
                  <datalist id="lista-cantidades"><option value="Escasa cantidad"><option value="Regular cantidad"><option value="Abundante cantidad"></datalist>
                  <details class="catgroup" style="max-width:420px;">
                    <summary><span class="catname">${nSel || otro ? nSel + (otro?' + otro':'') + ' seleccionado(s)' : 'Seleccionar hallazgos'}</span></summary>
                    ${p.opciones.map(op => `
                      <div class="testrow opcion-item" data-prueba="${d.prueba_id}" style="align-items:flex-start;">
                        <input type="checkbox" class="opcion-hallazgo" value="${op}" ${seleccionadas[op]!==undefined?'checked':''} ${disabled} onchange="syncOpciones(${d.prueba_id})">
                        <div style="flex:1;">
                          <label>${op}</label>
                          <input type="text" class="opcion-nota" list="lista-cantidades" placeholder="Cantidad (opcional)" value="${seleccionadas[op] || ''}" ${disabled} oninput="syncOpciones(${d.prueba_id})" style="margin-top:4px;font-size:12px;padding:4px 8px;width:100%;">
                        </div>
                      </div>`).join('')}
                    <div class="testrow">
                      <input type="text" class="opcion-otro" data-prueba="${d.prueba_id}" placeholder="Otro (no está en la lista)" value="${otro}" ${disabled} oninput="syncOpciones(${d.prueba_id})" style="width:100%;">
                    </div>
                  </details>`;
              } else {
                if (p.tipo === 'numerico') {
                  inputHtml = `<input type="number" step="any" class="cap-input" data-id="${d.prueba_id}" value="${d.valor_numerico ?? ''}"${oorStyle} ${d.estado==='validada'?'disabled':''}>`;
                } else {
                  const sugs = sugerenciasParaPrueba(p);
                  if (sugs) {
                    const listId = 'sug-' + d.prueba_id;
                    inputHtml = `<input type="text" class="cap-input" list="${listId}" data-id="${d.prueba_id}" value="${d.valor_texto ?? ''}"${oorStyle} ${d.estado==='validada'?'disabled':''}>
                      <datalist id="${listId}">${sugs.map(s => `<option value="${s}">`).join('')}</datalist>`;
                  } else {
                    inputHtml = `<input type="text" class="cap-input" data-id="${d.prueba_id}" value="${d.valor_texto ?? ''}"${oorStyle} ${d.estado==='validada'?'disabled':''}>`;
                  }
                }
              }
              return `<tr>
                <td>${p.nombre}${notaEspecialPrueba(p) ? '<div class="nota-especial">'+notaEspecialPrueba(p)+'</div>' : ''}</td>
                <td>${inputHtml} ${p.unidad ? '<span class="refbox">'+p.unidad+'</span>' : ''}
                  ${d.fuera_de_rango ? '<div class="refbox oor">⚠️ fuera de rango</div>' : ''}</td>
                <td><input type="text" class="cap-nota" data-id="${d.prueba_id}" value="${d.observaciones ?? ''}" placeholder="Opcional" ${d.estado==='validada'?'disabled':''}></td>
                <td class="refbox">${refTexto(ref)}</td>
                <td><span class="pill ${d.estado}">${d.estado}</span></td>
              </tr>`;
            }).join('')).join('')}
          </tbody></table>
        </div>`).join('')}

      <button class="btn secondary no-print" onclick="labsysSetView('captura-pdf', ${orden.id})">Descargar PDF para validación</button>
    </div>
  `;
}

function svgBarrasH(items, labelFn, valueFn) {
  if (items.length === 0) return '';
  const max = Math.max(...items.map(valueFn), 1);
  const filas = items.map((it, i) => {
    const val = valueFn(it);
    const w = Math.max((val / max) * 260, 2);
    const y = i * 26;
    return `
      <text x="0" y="${y+11}" font-size="11" fill="var(--text)">${labelFn(it)}</text>
      <rect x="0" y="${y+15}" width="${w}" height="8" rx="3" fill="var(--primary)"></rect>
      <text x="${w+6}" y="${y+22}" font-size="10" fill="var(--muted)">${val}</text>
    `;
  }).join('');
  return `<svg viewBox="0 0 340 ${items.length*26}" width="100%" style="max-width:420px;">${filas}</svg>`;
}

function svgBarrasV(items, labelFn, valueFn) {
  if (items.length === 0) return '';
  const max = Math.max(...items.map(valueFn), 1);
  const w = 40, gap = 10, h = 120;
  const totalW = Math.max(items.length * (w + gap), 200);
  const barras = items.map((it, i) => {
    const val = valueFn(it);
    const bh = Math.max((val / max) * h, 2);
    const x = i * (w + gap);
    return `
      <rect x="${x}" y="${h - bh}" width="${w}" height="${bh}" rx="3" fill="var(--primary)"></rect>
      <text x="${x + w/2}" y="${h - bh - 6}" font-size="10" fill="var(--muted)" text-anchor="middle">${val}</text>
      <text x="${x + w/2}" y="${h + 14}" font-size="9" fill="var(--muted)" text-anchor="middle">${labelFn(it)}</text>
    `;
  }).join('');
  return `<svg viewBox="0 0 ${totalW} ${h+26}" width="100%" height="150" preserveAspectRatio="xMidYMid meet" style="max-width:520px;">${barras}</svg>`;
}

function svgLineChart(items, labelFn, valueFn) {
  if (items.length === 0) return '';
  const max = Math.max(...items.map(valueFn), 1);
  const w = 60, h = 110, padTop = 18, padBottom = 22;
  const totalW = Math.max(items.length * w, 220);
  const points = items.map((it, i) => {
    const val = valueFn(it);
    const x = i * w + w / 2;
    const y = padTop + (h - (max ? (val / max) * h : 0));
    return { x, y, val, label: labelFn(it) };
  });
  const path = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x + ',' + p.y).join(' ');
  const area = points.length > 1
    ? path + ` L ${points[points.length-1].x},${h+padTop} L ${points[0].x},${h+padTop} Z`
    : '';
  const marcas = points.map(p => `
    <circle cx="${p.x}" cy="${p.y}" r="3.5" fill="var(--primary)"></circle>
    <text x="${p.x}" y="${p.y-10}" font-size="10" fill="var(--muted)" text-anchor="middle">${p.val}</text>
    <text x="${p.x}" y="${h+padTop+16}" font-size="9" fill="var(--muted)" text-anchor="middle">${p.label}</text>
  `).join('');
  return `<svg viewBox="0 0 ${totalW} ${h+padTop+padBottom}" width="100%" height="150" preserveAspectRatio="xMidYMid meet" style="max-width:520px;">
    ${area ? '<path d="'+area+'" fill="var(--primary-light)" opacity="0.6"></path>' : ''}
    <path d="${path}" fill="none" stroke="var(--primary)" stroke-width="2"></path>
    ${marcas}
  </svg>`;
}

function ordenesFiltroReporte() {
  const f = reporteFiltro;
  if (f.modo === 'general') return ordenes;
  return ordenes.filter(o => {
    const fecha = new Date(o.fecha);
    if (f.modo === 'anio') return String(fecha.getFullYear()) === String(f.anio);
    if (f.modo === 'mes') return o.fecha.slice(0, 7) === f.mes;
    if (f.modo === 'rango') {
      if (f.desde && o.fecha.slice(0, 10) < f.desde) return false;
      if (f.hasta && o.fecha.slice(0, 10) > f.hasta) return false;
      return true;
    }
    return true;
  });
}

function viewReportes() {
  const ordenesR = ordenesFiltroReporte();
  const aniosDisponibles = [...new Set(ordenes.map(o => new Date(o.fecha).getFullYear()))].sort((a,b) => b-a);
  const mesesDisponibles = [...new Set(ordenes.map(o => o.fecha.slice(0,7)))].sort().reverse();
  const todosDetalle = ordenesR.flatMap(o => o.detalle.map(d => ({ ...d, orden_id: o.id, paciente_id: o.paciente_id, fecha_orden: o.fecha })));
  const conResultado = todosDetalle.filter(d => d.estado === 'capturada' || d.estado === 'validada');

  // 1. Resumen general
  const totalFueraRango = todosDetalle.filter(d => d.fuera_de_rango).length;
  const resumen = [
    ['Pacientes registrados', pacientes.length],
    ['Órdenes en el período', ordenesR.length],
    ['Pendientes', ordenesR.filter(o => o.estado === 'pendiente').length],
    ['En proceso', ordenesR.filter(o => o.estado === 'en_proceso').length],
    ['Validadas', ordenesR.filter(o => o.estado === 'validada').length],
    ['Entregadas', ordenesR.filter(o => o.estado === 'entregada').length],
    ['Anuladas', ordenesR.filter(o => o.estado === 'anulada').length],
    ['Resultados capturados', conResultado.length],
    ['Resultados fuera de rango', totalFueraRango]
  ];

  // 3. Pruebas más solicitadas
  const conteoPruebas = {};
  todosDetalle.forEach(d => { conteoPruebas[d.prueba_id] = (conteoPruebas[d.prueba_id] || 0) + 1; });
  const pruebasTop = Object.entries(conteoPruebas).map(([id, n]) => ({ prueba: pruebaById(Number(id)), n }))
    .filter(x => x.prueba).sort((a, b) => b.n - a.n).slice(0, 10);

  // 4. Categorías más solicitadas
  const conteoCat = {};
  todosDetalle.forEach(d => {
    const p = pruebaById(d.prueba_id);
    if (!p) return;
    conteoCat[p.categoria_id] = (conteoCat[p.categoria_id] || 0) + 1;
  });
  const catTop = Object.entries(conteoCat).map(([id, n]) => ({ cat: CATEGORIAS.find(c => c.id === Number(id)), n }))
    .filter(x => x.cat).sort((a, b) => b.n - a.n);

  // 5. Resultados fuera de rango recientes
  const fueraRango = todosDetalle.filter(d => d.fuera_de_rango && d.fecha_captura)
    .sort((a, b) => new Date(b.fecha_captura) - new Date(a.fecha_captura)).slice(0, 15);

  // 6. Tiempo de validación (horas desde creada hasta validada) + backlog de órdenes abiertas
  const validadasConTiempo = ordenesR.filter(o => o.fecha_validacion).map(o => ({
    o, horas: (new Date(o.fecha_validacion) - new Date(o.fecha)) / 3600000
  }));
  const promedioHoras = validadasConTiempo.length ? (validadasConTiempo.reduce((s, x) => s + x.horas, 0) / validadasConTiempo.length) : null;
  const abiertas = ordenesR.filter(o => o.estado === 'pendiente' || o.estado === 'en_proceso')
    .map(o => ({ o, horas: (new Date() - new Date(o.fecha)) / 3600000 }))
    .sort((a, b) => b.horas - a.horas).slice(0, 10);

  // 7. Órdenes por médico referente
  const conteoMedicos = {};
  ordenesR.forEach(o => { const m = (o.medico || '').trim(); if (m) conteoMedicos[m] = (conteoMedicos[m] || 0) + 1; });
  const medicosTop = Object.entries(conteoMedicos).sort((a, b) => b[1] - a[1]).slice(0, 10);

  // 8. Producción por usuario
  const capturas = {}, validaciones = {};
  todosDetalle.forEach(d => {
    if (d.capturado_por) capturas[d.capturado_por] = (capturas[d.capturado_por] || 0) + 1;
    if (d.validado_por) validaciones[d.validado_por] = (validaciones[d.validado_por] || 0) + 1;
  });
  const nombresProduccion = [...new Set([...Object.keys(capturas), ...Object.keys(validaciones)])];
  const produccion = nombresProduccion.map(n => ({ nombre: n, capturas: capturas[n] || 0, validaciones: validaciones[n] || 0 }))
    .sort((a, b) => (b.capturas + b.validaciones) - (a.capturas + a.validaciones));

  // 9. Pacientes recurrentes
  const conteoPac = {};
  ordenesR.forEach(o => { conteoPac[o.paciente_id] = (conteoPac[o.paciente_id] || 0) + 1; });
  const recurrentes = Object.entries(conteoPac).map(([id, n]) => ({ pac: pacienteById(Number(id)), n }))
    .filter(x => x.pac && x.n > 1).sort((a, b) => b.n - a.n).slice(0, 10);

  // 10. Volumen de órdenes por mes
  const conteoMes = {};
  ordenesR.forEach(o => { const m = o.fecha.slice(0, 7); conteoMes[m] = (conteoMes[m] || 0) + 1; });
  const volumenMensual = Object.entries(conteoMes).sort((a, b) => a[0].localeCompare(b[0])).slice(-12);

  return `
    <div class="informe-header" style="margin-bottom:16px;">
      <div>
        ${laboratorio.logo ? '<img src="'+laboratorio.logo+'" alt="Logo" style="max-height:80px;max-width:130px;display:block;margin-bottom:8px;">' : ''}
        <strong>${laboratorio.nombre || 'LabSys'}</strong>
        ${laboratorio.direccion ? '<div class="refbox">'+laboratorio.direccion+'</div>' : ''}
        ${(laboratorio.telefono || laboratorio.correo) ? '<div class="refbox">'+[laboratorio.telefono, laboratorio.correo].filter(Boolean).join(' · ')+'</div>' : ''}
      </div>
      <div style="text-align:right">
        <div class="refbox">Reporte generado</div>
        <div class="refbox">${new Date().toLocaleString()}</div>
      </div>
    </div>
    <h1>Reportes</h1>
    <p class="lead">Calculados a partir de las órdenes del período seleccionado.</p>

    <div class="card no-print">
      <h2 style="font-size:14px;">Período</h2>
      <div class="row">
        <div><label>Ver</label>
          <select id="reporte-filtro-modo">
            <option value="general" ${reporteFiltro.modo==='general'?'selected':''}>General (todo)</option>
            <option value="anio" ${reporteFiltro.modo==='anio'?'selected':''}>Por año</option>
            <option value="mes" ${reporteFiltro.modo==='mes'?'selected':''}>Por mes</option>
            <option value="rango" ${reporteFiltro.modo==='rango'?'selected':''}>Rango de fechas</option>
          </select>
        </div>
        <div id="reporte-filtro-anio-wrap" style="display:${reporteFiltro.modo==='anio'?'block':'none'};">
          <label>Año</label>
          <select id="reporte-filtro-anio">${aniosDisponibles.map(a => `<option value="${a}" ${String(reporteFiltro.anio)===String(a)?'selected':''}>${a}</option>`).join('')}</select>
        </div>
        <div id="reporte-filtro-mes-wrap" style="display:${reporteFiltro.modo==='mes'?'block':'none'};">
          <label>Mes</label>
          <select id="reporte-filtro-mes">${mesesDisponibles.map(m => `<option value="${m}" ${reporteFiltro.mes===m?'selected':''}>${m}</option>`).join('')}</select>
        </div>
        <div id="reporte-filtro-desde-wrap" style="display:${reporteFiltro.modo==='rango'?'block':'none'};">
          <label>Desde</label><input type="date" id="reporte-filtro-desde" value="${reporteFiltro.desde}">
        </div>
        <div id="reporte-filtro-hasta-wrap" style="display:${reporteFiltro.modo==='rango'?'block':'none'};">
          <label>Hasta</label><input type="date" id="reporte-filtro-hasta" value="${reporteFiltro.hasta}">
        </div>
      </div>
      <button class="btn" id="btn-aplicar-filtro-reporte">Aplicar</button>
    </div>

    <button class="btn secondary no-print" onclick="window.print()" style="margin-bottom:16px;">Descargar / Imprimir PDF</button>

    <div class="card">
      <h2>1. Resumen general</h2>
      <div style="margin-bottom:16px;">${svgBarrasH(
        [['Pendientes', ordenes.filter(o=>o.estado==='pendiente').length],
         ['En proceso', ordenes.filter(o=>o.estado==='en_proceso').length],
         ['Validadas', ordenes.filter(o=>o.estado==='validada').length],
         ['Entregadas', ordenes.filter(o=>o.estado==='entregada').length],
         ['Anuladas', ordenes.filter(o=>o.estado==='anulada').length]],
        x => x[0], x => x[1]
      )}</div>
      <table><tbody>
        ${resumen.map(([label, val]) => `<tr><td>${label}</td><td style="text-align:right;font-weight:600;">${val}</td></tr>`).join('')}
      </tbody></table>
    </div>

    <div class="card">
      <h2>2. Pruebas más solicitadas</h2>
      ${pruebasTop.length === 0 ? '<div class="empty">Todavía no hay datos.</div>' : `
      <div style="margin-bottom:16px;">${svgBarrasH(pruebasTop, x => x.prueba.nombre.length > 24 ? x.prueba.nombre.slice(0,24)+'…' : x.prueba.nombre, x => x.n)}</div>
      <table><thead><tr><th>Prueba</th><th>Categoría</th><th style="text-align:right;">Veces solicitada</th></tr></thead><tbody>
        ${pruebasTop.map(x => `<tr><td>${x.prueba.nombre}</td><td class="refbox">${CATEGORIAS.find(c=>c.id===x.prueba.categoria_id)?.nombre || '—'}</td><td style="text-align:right;">${x.n}</td></tr>`).join('')}
      </tbody></table>`}
    </div>

    <div class="card">
      <h2>3. Categorías más solicitadas</h2>
      ${catTop.length === 0 ? '<div class="empty">Todavía no hay datos.</div>' : `
      <div style="margin-bottom:16px;">${svgBarrasH(catTop.slice(0,10), x => x.cat.nombre.length > 24 ? x.cat.nombre.slice(0,24)+'…' : x.cat.nombre, x => x.n)}</div>
      <table><thead><tr><th>Categoría</th><th style="text-align:right;">Pruebas solicitadas</th></tr></thead><tbody>
        ${catTop.map(x => `<tr><td>${x.cat.nombre}</td><td style="text-align:right;">${x.n}</td></tr>`).join('')}
      </tbody></table>`}
    </div>

    <div class="card">
      <h2>4. Resultados fuera de rango recientes</h2>
      ${fueraRango.length === 0 ? '<div class="empty">Sin resultados fuera de rango registrados.</div>' : `
      <table><thead><tr><th>Paciente</th><th>Prueba</th><th>Resultado</th><th>Fecha</th></tr></thead><tbody>
        ${fueraRango.map(d => {
          const p = pruebaById(d.prueba_id); const pac = pacienteById(d.paciente_id);
          const val = p.tipo === 'numerico' ? d.valor_numerico : d.valor_texto;
          return `<tr><td>${pac ? pac.nombres+' '+pac.apellidos : '—'}</td><td>${p.nombre}</td><td class="oor">⚠️ ${val} ${p.unidad||''}</td><td class="refbox">${new Date(d.fecha_captura).toLocaleDateString()}</td></tr>`;
        }).join('')}
      </tbody></table>`}
    </div>

    <div class="card">
      <h2>5. Tiempo de validación</h2>
      <p class="refbox">Promedio desde que se crea la orden hasta que se valida: <strong>${promedioHoras !== null ? promedioHoras.toFixed(1)+' horas' : 'sin datos todavía'}</strong></p>
      <h3 style="font-size:13px;margin-top:14px;">Órdenes abiertas con más tiempo esperando (posible atraso)</h3>
      ${abiertas.length === 0 ? '<div class="empty">No hay órdenes abiertas.</div>' : `
      <table><thead><tr><th>Folio</th><th>Paciente</th><th>Estado</th><th style="text-align:right;">Horas abierta</th></tr></thead><tbody>
        ${abiertas.map(x => { const pac = pacienteById(x.o.paciente_id); return `<tr><td>#${String(x.o.id).padStart(4,'0')}</td><td>${pac ? pac.nombres+' '+pac.apellidos : '—'}</td><td><span class="pill ${x.o.estado}">${x.o.estado.replace('_',' ')}</span></td><td style="text-align:right;">${x.horas.toFixed(1)}</td></tr>`; }).join('')}
      </tbody></table>`}
    </div>

    <div class="card">
      <h2>6. Órdenes por médico referente</h2>
      ${medicosTop.length === 0 ? '<div class="empty">Ninguna orden tiene médico referente registrado.</div>' : `
      <table><thead><tr><th>Médico</th><th style="text-align:right;">Órdenes</th></tr></thead><tbody>
        ${medicosTop.map(([nombre, n]) => `<tr><td>${nombre}</td><td style="text-align:right;">${n}</td></tr>`).join('')}
      </tbody></table>`}
    </div>

    <div class="card">
      <h2>7. Producción por usuario</h2>
      ${produccion.length === 0 ? '<div class="empty">Todavía no hay capturas ni validaciones.</div>' : `
      <table><thead><tr><th>Usuario</th><th style="text-align:right;">Resultados capturados</th><th style="text-align:right;">Resultados validados</th></tr></thead><tbody>
        ${produccion.map(x => `<tr><td>${x.nombre}</td><td style="text-align:right;">${x.capturas}</td><td style="text-align:right;">${x.validaciones}</td></tr>`).join('')}
      </tbody></table>`}
    </div>

    <div class="card">
      <h2>8. Pacientes recurrentes</h2>
      ${recurrentes.length === 0 ? '<div class="empty">Todavía ningún paciente tiene más de una orden.</div>' : `
      <table><thead><tr><th>Paciente</th><th style="text-align:right;">Órdenes</th></tr></thead><tbody>
        ${recurrentes.map(x => `<tr><td>${x.pac.nombres} ${x.pac.apellidos}</td><td style="text-align:right;">${x.n}</td></tr>`).join('')}
      </tbody></table>`}
    </div>

    <div class="card">
      <h2>9. Volumen de órdenes por mes</h2>
      ${volumenMensual.length === 0 ? '<div class="empty">Todavía no hay órdenes.</div>' : `
      <div style="margin-bottom:16px;overflow-x:auto;">${svgLineChart(volumenMensual, x => x[0].slice(2), x => x[1])}</div>
      <table><thead><tr><th>Mes</th><th style="text-align:right;">Órdenes creadas</th></tr></thead><tbody>
        ${volumenMensual.map(([mes, n]) => `<tr><td>${mes}</td><td style="text-align:right;">${n}</td></tr>`).join('')}
      </tbody></table>`}
    </div>

    <div class="card">
      <h2>10. Catálogo activo vs. inactivo</h2>
      <table><tbody>
        <tr><td>Pruebas activas</td><td style="text-align:right;font-weight:600;">${PRUEBAS.filter(p => p.activo !== false).length}</td></tr>
        <tr><td>Pruebas desactivadas</td><td style="text-align:right;font-weight:600;">${PRUEBAS.filter(p => p.activo === false).length}</td></tr>
        <tr><td>Categorías</td><td style="text-align:right;font-weight:600;">${CATEGORIAS.length}</td></tr>
        <tr><td>Médicos registrados</td><td style="text-align:right;font-weight:600;">${medicos.length}</td></tr>
      </tbody></table>
    </div>
  `;
}

// ---------- Event handlers ----------

function attachHandlers() {
  const btnTogglePass = document.getElementById('btn-toggle-pass');
  if (btnTogglePass) btnTogglePass.addEventListener('click', () => {
    const inp = document.getElementById('login-pass-input');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  });

  const flg = document.getElementById('form-login');
  if (flg) flg.addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(flg);
    const { error } = await supabase.auth.signInWithPassword({ email: fd.get('correo').trim(), password: fd.get('password') });
    if (error) { loginError = 'Correo o contraseña incorrectos.'; render(); return; }
    const { data: { user } } = await supabase.auth.getUser();
    await onAuthed(user);
  });

  const fmp = document.getElementById('form-mi-password');
  if (fmp) fmp.addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(fmp);
    if (fd.get('password') !== fd.get('password2')) { toast('Las contraseñas no coinciden'); return; }
    const { error } = await supabase.auth.updateUser({ password: fd.get('password') });
    if (error) { toast('Error: ' + error.message); return; }
    logAccion('Cambió su contraseña', '');
    toast('Contraseña actualizada'); fmp.reset();
  });

  document.querySelectorAll('[data-guardar-nombre]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const uid = btn.dataset.guardarNombre;
      const input = document.querySelector(`[data-nombre-usuario="${uid}"]`);
      const nuevoNombre = input.value.trim();
      if (!nuevoNombre) { toast('El nombre no puede quedar vacío'); return; }
      const { error } = await supabase.from('perfiles').update({ nombre: nuevoNombre }).eq('id', uid);
      if (error) { toast('Error: ' + error.message); return; }
      const u = usuarios.find(x => x.id === uid);
      u.nombre = nuevoNombre;
      if (sesion.id === uid) sesion.nombre = nuevoNombre;
      logAccion('Editó nombre de usuario', nuevoNombre);
      toast('Nombre actualizado'); render();
    });
  });

  document.querySelectorAll('[data-rol-usuario]').forEach(sel => {
    sel.addEventListener('change', async () => {
      const uid = sel.dataset.rolUsuario;
      const { error } = await supabase.from('perfiles').update({ rol: sel.value }).eq('id', uid);
      if (error) { toast('Error: ' + error.message); return; }
      const u = usuarios.find(x => x.id === uid);
      u.rol = sel.value;
      logAccion('Cambió rol de usuario', u.correo + ' → ' + sel.value);
      toast('Rol actualizado');
    });
  });

  document.querySelectorAll('[data-toggle-usuario]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const uid = btn.dataset.toggleUsuario;
      const u = usuarios.find(x => x.id === uid);
      const nuevo = u.activo === false ? true : false;
      const { error } = await supabase.from('perfiles').update({ activo: nuevo }).eq('id', uid);
      if (error) { toast('Error: ' + error.message); return; }
      u.activo = nuevo;
      logAccion(nuevo ? 'Activó usuario' : 'Desactivó usuario', u.correo);
      render();
    });
  });

  document.querySelectorAll('[data-guardar-permisos]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const uid = btn.dataset.guardarPermisos;
      const checks = document.querySelectorAll(`[data-permiso-extra="${uid}"]`);
      const seleccionados = Array.from(checks).filter(c => c.checked).map(c => c.value);
      const { error } = await supabase.from('perfiles').update({ permisos_extra: seleccionados.length ? seleccionados : null }).eq('id', uid);
      if (error) { toast('Error: ' + error.message); return; }
      const u = usuarios.find(x => x.id === uid);
      u.permisos_extra = seleccionados;
      if (sesion.id === uid) sesion.permisos_extra = seleccionados;
      logAccion('Actualizó permisos extra de usuario', u.correo + ' → ' + (seleccionados.join(', ') || 'ninguno'));
      toast('Permisos actualizados');
      render();
    });
  });

  const buscadorInforme = document.getElementById('buscador-informe');
  if (buscadorInforme) buscadorInforme.addEventListener('input', () => {
    const q = buscadorInforme.value.trim().toLowerCase();
    document.querySelectorAll('#tabla-informe tbody tr').forEach(row => {
      row.style.display = (!q || row.dataset.busca.includes(q)) ? '' : 'none';
    });
  });

  const filtroModo = document.getElementById('reporte-filtro-modo');
  if (filtroModo) filtroModo.addEventListener('change', () => {
    document.getElementById('reporte-filtro-anio-wrap').style.display = filtroModo.value === 'anio' ? 'block' : 'none';
    document.getElementById('reporte-filtro-mes-wrap').style.display = filtroModo.value === 'mes' ? 'block' : 'none';
    document.getElementById('reporte-filtro-desde-wrap').style.display = filtroModo.value === 'rango' ? 'block' : 'none';
    document.getElementById('reporte-filtro-hasta-wrap').style.display = filtroModo.value === 'rango' ? 'block' : 'none';
  });

  const btnAplicarFiltro = document.getElementById('btn-aplicar-filtro-reporte');
  if (btnAplicarFiltro) btnAplicarFiltro.addEventListener('click', () => {
    const modo = document.getElementById('reporte-filtro-modo').value;
    reporteFiltro = {
      modo,
      anio: document.getElementById('reporte-filtro-anio') ? document.getElementById('reporte-filtro-anio').value : '',
      mes: document.getElementById('reporte-filtro-mes') ? document.getElementById('reporte-filtro-mes').value : '',
      desde: document.getElementById('reporte-filtro-desde') ? document.getElementById('reporte-filtro-desde').value : '',
      hasta: document.getElementById('reporte-filtro-hasta') ? document.getElementById('reporte-filtro-hasta').value : ''
    };
    render();
  });

  const formInsumo = document.getElementById('form-insumo');
  if (formInsumo) formInsumo.addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(formInsumo);
    const { data, error } = await supabase.from('insumos').insert({ nombre: fd.get('nombre'), unidad: fd.get('unidad') || null, categoria: fd.get('categoria') || null, activo: true }).select().single();
    if (error) { toast('Error: ' + error.message); return; }
    insumos.push(data); insumos.sort((a,b) => a.nombre.localeCompare(b.nombre));
    toast('Insumo agregado');
    logAccion('Agregó insumo al catálogo', data.nombre);
    formInsumo.reset(); render();

    if (error) { toast('Error: ' + error.message); return; }
    laboratorio = { ...laboratorio, ...patch };
    toast('Datos del laboratorio guardados');
    logAccion('Actualizó datos del laboratorio', '');
    render();
  });

  const btnCrear = document.getElementById('btn-crear-orden');
  if (btnCrear) btnCrear.addEventListener('click', async () => {
    const pacId = document.getElementById('sel-paciente').value;
    if (!pacId) { toast('Selecciona un paciente'); return; }
    const checks = Array.from(document.querySelectorAll('.chk-prueba:checked'));
    if (checks.length === 0) { toast('Selecciona al menos una prueba'); return; }
    const medicoNombre = document.getElementById('orden-medico').value.trim();
    const { data: ordenData, error: ordErr } = await supabase.from('ordenes').insert({
      paciente_id: Number(pacId), medico_nombre: medicoNombre || null, usuario_recepcion: sesion.id, estado: 'pendiente'
    }).select().single();
    if (ordErr) { toast('Error: ' + ordErr.message); return; }
    const detalleRows = checks.map(c => ({ orden_id: ordenData.id, prueba_id: Number(c.value), estado: 'pendiente' }));
    const { data: detData, error: detErr } = await supabase.from('orden_detalle').insert(detalleRows).select();
    if (detErr) { toast('Error: ' + detErr.message); return; }
    const orden = { id: ordenData.id, paciente_id: ordenData.paciente_id, fecha: ordenData.fecha, medico: ordenData.medico_nombre, estado: ordenData.estado, detalle: detData };
    ordenes.push(orden);
    toast('Orden #' + String(orden.id).padStart(4,'0') + ' creada con ' + checks.length + ' pruebas');
    logAccion('Creó orden', 'Folio #' + String(orden.id).padStart(4,'0') + ' — ' + checks.length + ' pruebas');
    setView('captura', orden.id);
  });

  const btnGuardarCaptura = document.getElementById('btn-guardar-captura');
  if (btnGuardarCaptura) btnGuardarCaptura.addEventListener('click', async () => {
    const u = sesion.nombre;
    const orden = ordenById(Number(ctxOrdenId));
    const pac = pacienteById(orden.paciente_id);
    let n = 0;
    for (const d of orden.detalle) {
      if (d.estado === 'validada') continue;
      const inp = document.querySelector(`.cap-input[data-id="${d.prueba_id}"]`);
      const notaInp = document.querySelector(`.cap-nota[data-id="${d.prueba_id}"]`);
      if (!inp) continue;
      const nota = notaInp ? notaInp.value.trim() : '';
      const patch = {};
      let cambioResultado = false;
      if (inp.value !== '') {
        const p = pruebaById(d.prueba_id);
        if (p.tipo === 'numerico') {
          patch.valor_numerico = Number(inp.value);
          const ref = refFor(p, pac);
          patch.fuera_de_rango = !!(ref && ((ref.min !== undefined && patch.valor_numerico < ref.min) || (ref.max !== undefined && patch.valor_numerico > ref.max)));
        } else {
          patch.valor_texto = inp.value;
          patch.fuera_de_rango = false;
        }
        patch.estado = 'capturada';
        patch.capturado_por = u;
        patch.fecha_captura = new Date().toISOString();
        cambioResultado = true;
      }
      patch.observaciones = nota || null;
      if (!cambioResultado && nota === (d.observaciones || '')) continue;
      const { error } = await supabase.from('orden_detalle').update(patch).eq('id', d.id);
      if (error) { toast('Error: ' + error.message); continue; }
      Object.assign(d, patch);
      if (patch.observaciones === null) delete d.observaciones;
      if (cambioResultado) n++;
    }
    if (orden.estado === 'pendiente' && n > 0) {
      await supabase.from('ordenes').update({ estado: 'en_proceso' }).eq('id', orden.id);
      orden.estado = 'en_proceso';
    }
    toast(n + ' resultado(s) guardados');
    if (n > 0) logAccion('Capturó resultados', 'Orden #' + String(orden.id).padStart(4,'0') + ' — ' + n + ' resultado(s)');
    render();
  });

  const btnValidar = document.getElementById('btn-validar-orden');
  if (btnValidar) btnValidar.addEventListener('click', async () => {
    const u = sesion.nombre;
    const orden = ordenById(Number(ctxOrdenId));
    const now = new Date().toISOString();
    const aValidar = orden.detalle.filter(d => d.estado === 'capturada');
    for (const d of aValidar) {
      const { error } = await supabase.from('orden_detalle').update({ estado: 'validada', validado_por: u, fecha_validacion: now }).eq('id', d.id);
      if (!error) { d.estado = 'validada'; d.validado_por = u; d.fecha_validacion = now; }
    }
    const patch = { estado: 'validada', fecha_validacion: now };
    if (!orden.codigo_verificacion) {
      patch.codigo_verificacion = (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2))).replace(/-/g, '');
    }
    await supabase.from('ordenes').update(patch).eq('id', orden.id);
    Object.assign(orden, patch);
    toast(aValidar.length + ' resultado(s) validados');
    logAccion('Validó orden', 'Folio #' + String(orden.id).padStart(4,'0') + ' — ' + aValidar.length + ' resultado(s)');
    setView('validacion');
  });

  const btnEntregada = document.getElementById('btn-marcar-entregada');
  if (btnEntregada) btnEntregada.addEventListener('click', async () => {
    const orden = ordenById(Number(ctxOrdenId));
    const medioSel = document.getElementById('sel-medio-entrega');
    const medioTextos = { impreso: 'Impreso en mano', correo: 'Correo electrónico', whatsapp: 'WhatsApp', portal: 'Portal / en línea' };
    const medio = medioSel ? medioSel.value : 'impreso';
    const patch = {
      estado: 'entregada', medio_entrega: medio, medio_texto: medioTextos[medio],
      receptor: document.getElementById('input-receptor').value.trim(),
      entregado_por: sesion.nombre, fecha_entrega: new Date().toISOString()
    };
    const { error } = await supabase.from('ordenes').update(patch).eq('id', orden.id);
    if (error) { toast('Error: ' + error.message); return; }
    Object.assign(orden, patch);
    toast('Marcada como entregada');
    logAccion('Marcó entregada', 'Folio #' + String(orden.id).padStart(4,'0') + ' — ' + orden.medio_texto);
    render();
  });

  document.querySelectorAll('[data-anular-orden]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const motivo = prompt('¿Por qué se anula esta orden?');
      if (motivo === null) return;
      if (!motivo.trim()) { toast('Escribe un motivo para anular'); return; }
      const orden = ordenById(Number(btn.dataset.anularOrden));
      const patch = { estado: 'anulada', motivo_anulacion: motivo.trim(), anulada_por: sesion.nombre, fecha_anulacion: new Date().toISOString() };
      const { error } = await supabase.from('ordenes').update(patch).eq('id', orden.id);
      if (error) { toast('Error: ' + error.message); return; }
      Object.assign(orden, patch);
      toast('Orden anulada');
      logAccion('Anuló orden', 'Folio #' + String(orden.id).padStart(4,'0') + ' — Motivo: ' + orden.motivo_anulacion);
      render();
    });
  });
}


init();
})();
</script>
